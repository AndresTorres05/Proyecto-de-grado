<div class="shell">
  <aside class="shell__sidebar">
    <a class="shell__brand" routerLink="/">
      <img src="logo.png" alt="Logo GEMA" class="logo-mark" />
      <span class="shell__brand-text">
        <span class="shell__brand-name">GEMA</span>
        <span class="shell__brand-tagline">Panel principal</span>
      </span>
    </a>

    <nav class="shell__nav" aria-label="Navegación del panel">
      <ul>
        @for (item of navItems; track item.label) {
  <li>
    @if (item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="shell__nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shell__nav-link"
      >
        <span class="shell__nav-icon" aria-hidden="true">
          {{ item.icon }}
        </span>

        <span>{{ item.label }}</span>
      </a>
    } @else {
      <a
        href="#"
        class="shell__nav-link"
        [class.shell__nav-link--active]="item.active"
      >
        <span class="shell__nav-icon" aria-hidden="true">
          {{ item.icon }}
        </span>

        <span>{{ item.label }}</span>
      </a>
    }
  </li>
}
      </ul>
    </nav>

    
  </aside>

  <div class="shell__main">
    <header class="shell__topbar">
      <div class="shell__topbar-left">
        <span class="shell__role-pill">{{ roleLabel }}</span>
      </div>

      <div class="shell__topbar-right">
        <button class="shell__icon-btn" type="button" aria-label="Notificaciones">
          <span aria-hidden="true">🔔</span>
          @if (notifCount > 0) {
            <span class="shell__badge">{{ notifCount }}</span>
          }
        </button>

        <div class="shell__user">
          <span class="shell__avatar">{{ userInitials }}</span>
          <span class="shell__user-name">{{ userName }}</span>
        </div>

        <a href="#" class="shell__logout" title="Cerrar sesión (prototipo, aún no implementado)">
          <span aria-hidden="true">⏻</span>
        </a>
      </div>
    </header>

    <main class="shell__content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
