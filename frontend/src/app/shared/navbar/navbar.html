<header class="navbar">

  <div class="container navbar__inner">

    <a
      class="navbar__brand"
      href="#hero"
      aria-label="VITA+, ir al inicio"
    >
      <img
        src="logo.png"
        alt="Logo VITA+"
        class="logo-mark"
      />

      <span class="navbar__brand-text">
        <span class="navbar__brand-name">VITA+</span>

        <span class="navbar__brand-tagline">
          Cuidado conectado para personas mayores
        </span>
      </span>
    </a>

    <nav
      class="navbar__nav"
      aria-label="Navegación principal"
    >
      <ul class="navbar__links">

        @for (link of navLinks; track link.href) {
          <li>
            <a [href]="link.href">
              {{ link.label }}
            </a>
          </li>
        }

      </ul>
    </nav>

    <div class="navbar__actions">

      @if (!autenticado()) {

        <a
          class="navbar__login-link"
          routerLink="/login"
        >
          Iniciar sesión
        </a>

        <a
          class="btn btn-primary"
          routerLink="/registro"
        >
          Crear cuenta
        </a>

      } @else {

        <div class="navbar__user">

          <!-- Inicial del usuario -->
          <button
            type="button"
            class="navbar__user-avatar"
            (click)="irAlDashboard()"
            [title]="'Ir al dashboard de ' + nombreUsuario"
          >
            {{ inicialUsuario }}
          </button>

          <!-- Cerrar sesión -->
          <button
            type="button"
            class="navbar__logout"
            (click)="cerrarSesion()"
            aria-label="Cerrar sesión"
            title="Cerrar sesión"
          >
            <app-icon name="power" />
          </button>

        </div>

      }

    </div>

  </div>

</header>
