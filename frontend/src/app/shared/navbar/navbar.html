<header class="navbar">
  <div class="container navbar__inner">
    <a class="navbar__brand" href="#inicio" aria-label="GEMA, ir al inicio">
      <img src="logo.png" alt="Logo GEMA" class="logo-mark" />
      <span class="navbar__brand-text">
        <span class="navbar__brand-name">GEMA</span>
        <span class="navbar__brand-tagline">Gestión Estratégica para Mayores</span>
      </span>
    </a>

    <nav class="navbar__nav" aria-label="Navegación principal">
      <ul class="navbar__links">
        @for (link of navLinks; track link.href) {
          <li>
            <a [href]="link.href">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="navbar__actions">
  <a class="navbar__login-link" routerLink="/login">Iniciar sesión</a>
  <a class="btn btn-primary" routerLink="/registro">Crear cuenta</a>
</div>
  </div>
</header>
