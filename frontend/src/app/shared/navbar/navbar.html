<header class="navbar">

  <div class="container navbar__inner">

    <a
      class="navbar__brand"
      href="#hero"
      aria-label="VITA+, ir al inicio"
    >
      <img
        src="logo.png"
        alt="Logo VITA+"
        class="logo-mark"
      />

      <span class="navbar__brand-text">
        <span class="navbar__brand-name">VITA+</span>

        <span class="navbar__brand-tagline">
          Cuidamos juntos a quienes importan
        </span>
      </span>
    </a>

    <nav
      class="navbar__nav"
      aria-label="Navegación principal"
    >
      <ul class="navbar__links">

        @for (link of navLinks; track link.href) {
          <li>
            <a [href]="link.href">
              {{ link.label }}
            </a>
          </li>
        }

      </ul>
    </nav>

    <div class="navbar__actions">

      @if (!autenticado()) {

        <a
          class="navbar__login-link"
          routerLink="/login"
        >
          Iniciar sesión
        </a>

        <a
          class="btn btn-primary"
          routerLink="/registro"
        >
          Crear cuenta
        </a>

      } @else {

        <div class="navbar__user">

  <!-- Inicial del usuario -->
  <button
    type="button"
    class="navbar__user-avatar"
    (click)="toggleMenuUsuario()"
    [title]="nombreUsuario"
    [attr.aria-expanded]="menuUsuarioAbierto"
  >
    {{ inicialUsuario }}
  </button>

  @if (menuUsuarioAbierto) {
    <div class="navbar__user-menu">

          <button
            type="button"
            (click)="irAMiInformacion()"
          >
            Página principal
          </button>

          <button
            type="button"
            class="navbar__menu-logout"
            (click)="cerrarSesion()"
          >
            Cerrar sesión
          </button>

        </div>
      }

    </div>

      }

    </div>

  </div>

</header>
