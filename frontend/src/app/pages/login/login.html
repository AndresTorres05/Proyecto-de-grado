<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <img src="logo.png" alt="Logo GEMA" class="login-brand__logo" />
      <span class="login-brand__name">GEMA</span>
    </div>

    <a routerLink="/" class="login-back">← Volver al inicio</a>

    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Ingresa tus credenciales para acceder a tu panel</p>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <label class="login-label" for="correo">Correo</label>
      <input
        id="correo"
        name="correo"
        type="email"
        class="login-input"
        [(ngModel)]="correo"
        required
        placeholder="tucorreo@ejemplo.com"
      />

      <label class="login-label" for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        name="contrasena"
        type="password"
        class="login-input"
        [(ngModel)]="contrasena"
        required
        placeholder="••••••••"
      />

      @if (errorMensaje()) {
        <p class="login-error">{{ errorMensaje() }}</p>
      }

      <button type="submit" class="btn btn-primary login-submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
