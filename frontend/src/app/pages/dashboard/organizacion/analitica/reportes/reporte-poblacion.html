<div class="kpis">
  <app-kpi
    etiqueta="Personas asociadas"
    icono="users"
    [valor]="kpis().total.toString()"
    detalle="Con asociación aceptada"
  />
  <app-kpi
    etiqueta="Edad promedio"
    icono="calendar"
    [valor]="kpis().edadPromedio"
    [detalle]="kpis().detalleEdad"
  />
  <app-kpi
    etiqueta="Con EPS registrada"
    icono="clipboard"
    [valor]="kpis().conEps"
    [detalle]="kpis().detalleEps"
  />
  <app-kpi
    etiqueta="Con intereses registrados"
    icono="sparkles"
    [valor]="kpis().conIntereses"
    [detalle]="kpis().detalleIntereses"
  />
</div>

<div class="graficas">
  <app-grafica-card
    titulo="Rangos de edad"
    descripcion="Cuántas personas mayores hay en cada rango de edad."
    [opciones]="graficaEdad()"
    [tabla]="tablaEdad()"
    [vacio]="datos().personas.length === 0"
    textoVacio="Aún no tienes personas mayores asociadas."
  />

  <app-grafica-card
    titulo="Género"
    descripcion="Distribución por género de las personas asociadas."
    [opciones]="graficaGenero()"
    [tabla]="tablaGenero()"
    [vacio]="datos().personas.length === 0"
    textoVacio="Aún no tienes personas mayores asociadas."
  />

  <app-grafica-card
    titulo="EPS"
    descripcion="Entidades de salud de las personas asociadas."
    [opciones]="graficaEps()"
    [tabla]="tablaEps()"
    [vacio]="datos().personas.length === 0"
    textoVacio="Aún no tienes personas mayores asociadas."
  />

  <app-grafica-card
    titulo="Intereses más comunes"
    descripcion="Los 10 gustos, talentos y hobbies más frecuentes. Útil para planear actividades que les gusten."
    [opciones]="graficaIntereses()"
    [tabla]="tablaIntereses()"
    [alto]="340"
    [vacio]="datos().intereses.length === 0"
    textoVacio="Ninguna persona asociada ha registrado sus intereses."
  />
</div>
