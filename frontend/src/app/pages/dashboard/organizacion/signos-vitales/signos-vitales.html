<div class="signos-container">

  <div class="encabezado">
    <div>
      <h1>Registro de signos vitales</h1>
      <p>
        Registra los signos vitales de las personas mayores asociadas a tu organización.
      </p>
    </div>
  </div>

  <!-- Mensaje de éxito -->
  @if (mensajeExito) {
    <div class="mensaje exito">
      {{ mensajeExito }}
    </div>
  }

  <!-- Mensaje de error -->
  @if (mensajeError) {
    <div class="mensaje error">
      {{ mensajeError }}
    </div>
  }

  <div class="formulario-card">

    <!-- Persona mayor -->
    <div class="campo campo-completo">
      <label for="personaMayor">
        Persona mayor <span class="obligatorio">*</span>
      </label>

      <select
        id="personaMayor"
        [(ngModel)]="idPersonaMayor"
        [disabled]="cargandoPersonas || guardando"
      >
        <option [ngValue]="null">
          @if (cargandoPersonas) {
            Cargando personas mayores...
          } @else {
            Selecciona una persona mayor
          }
        </option>

        @for (persona of personasMayores; track persona.idPersonaMayor) {
          <option [ngValue]="persona.idPersonaMayor">
            {{ persona.nombreUsuario }}
          </option>
        }
      </select>
    </div>

    <!-- Presión arterial -->
    <div class="campo">
      <label for="presionSistolica">
        Presión sistólica
      </label>

      <div class="input-unidad">
        <input
          id="presionSistolica"
          type="number"
          min="0"
          [(ngModel)]="presionSistolica"
          [disabled]="guardando"
          placeholder="Ej. 120"
        />
        <span>mmHg</span>
      </div>
    </div>

    <div class="campo">
      <label for="presionDiastolica">
        Presión diastólica
      </label>

      <div class="input-unidad">
        <input
          id="presionDiastolica"
          type="number"
          min="0"
          [(ngModel)]="presionDiastolica"
          [disabled]="guardando"
          placeholder="Ej. 80"
        />
        <span>mmHg</span>
      </div>
    </div>

    <!-- Frecuencia cardíaca -->
    <div class="campo">
      <label for="frecuenciaCardiaca">
        Frecuencia cardíaca
      </label>

      <div class="input-unidad">
        <input
          id="frecuenciaCardiaca"
          type="number"
          min="0"
          [(ngModel)]="frecuenciaCardiaca"
          [disabled]="guardando"
          placeholder="Ej. 72"
        />
        <span>lpm</span>
      </div>
    </div>

    <!-- Frecuencia respiratoria -->
    <div class="campo">
      <label for="frecuenciaRespiratoria">
        Frecuencia respiratoria
      </label>

      <div class="input-unidad">
        <input
          id="frecuenciaRespiratoria"
          type="number"
          min="0"
          [(ngModel)]="frecuenciaRespiratoria"
          [disabled]="guardando"
          placeholder="Ej. 16"
        />
        <span>rpm</span>
      </div>
    </div>

    <!-- Temperatura -->
    <div class="campo">
      <label for="temperatura">
        Temperatura
      </label>

      <div class="input-unidad">
        <input
          id="temperatura"
          type="number"
          step="0.1"
          min="0"
          [(ngModel)]="temperatura"
          [disabled]="guardando"
          placeholder="Ej. 36.5"
        />
        <span>°C</span>
      </div>
    </div>

    <!-- Saturación -->
    <div class="campo">
      <label for="saturacionOxigeno">
        Saturación de oxígeno
      </label>

      <div class="input-unidad">
        <input
          id="saturacionOxigeno"
          type="number"
          min="0"
          max="100"
          [(ngModel)]="saturacionOxigeno"
          [disabled]="guardando"
          placeholder="Ej. 98"
        />
        <span>%</span>
      </div>
    </div>

    <!-- Peso -->
    <div class="campo">
      <label for="peso">
        Peso
      </label>

      <div class="input-unidad">
        <input
          id="peso"
          type="number"
          step="0.1"
          min="0"
          [(ngModel)]="peso"
          [disabled]="guardando"
          placeholder="Ej. 65.5"
        />
        <span>kg</span>
      </div>
    </div>

    <!-- Observaciones -->
    <div class="campo campo-completo">
      <label for="observaciones">
        Observaciones
      </label>

      <textarea
        id="observaciones"
        [(ngModel)]="observaciones"
        [disabled]="guardando"
        rows="4"
        placeholder="Agrega alguna observación relevante..."
      ></textarea>
    </div>

    <!-- Botones -->
    <div class="acciones campo-completo">

      <button
        type="button"
        class="btn-secundario"
        (click)="limpiarFormulario()"
        [disabled]="guardando"
      >
        Limpiar
      </button>

      <button
        type="button"
        class="btn-principal"
        (click)="registrarSignosVitales()"
        [disabled]="guardando || cargandoPersonas"
      >
        @if (guardando) {
          Guardando...
        } @else {
          Registrar signos vitales
        }
      </button>

    </div>

  </div>

</div>
