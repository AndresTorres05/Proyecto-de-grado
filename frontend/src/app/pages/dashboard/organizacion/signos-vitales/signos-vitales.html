<div class="signos-container">

  <div class="page-header">
    <div>
      <h1>Registro de signos vitales</h1>
      <p>
        Registra y consulta los signos vitales de las personas mayores
        pertenecientes a tu organización.
      </p>
    </div>
  </div>

  <section class="form-card">

    <h2>Nuevo registro</h2>
    <p class="form-description">
      Ingresa los datos correspondientes a la medición realizada.
    </p>

    <form>

      <div class="form-grid">

        <div class="form-group">
          <label for="persona">Persona mayor</label>
          <select id="persona">
            <option value="">Selecciona una persona</option>
          </select>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha y hora</label>
          <input
            id="fecha"
            type="datetime-local"
          />
        </div>

        <div class="form-group">
          <label for="presion">Presión arterial</label>
          <input
            id="presion"
            type="text"
            placeholder="Ej. 120/80"
          />
          <span class="input-hint">mmHg</span>
        </div>

        <div class="form-group">
          <label for="frecuencia">Frecuencia cardíaca</label>
          <input
            id="frecuencia"
            type="number"
            placeholder="Ej. 72"
          />
          <span class="input-hint">lpm</span>
        </div>

        <div class="form-group">
          <label for="respiratoria">Frecuencia respiratoria</label>
          <input
            id="respiratoria"
            type="number"
            placeholder="Ej. 18"
          />
          <span class="input-hint">rpm</span>
        </div>

        <div class="form-group">
          <label for="temperatura">Temperatura</label>
          <input
            id="temperatura"
            type="number"
            step="0.1"
            placeholder="Ej. 36.5"
          />
          <span class="input-hint">°C</span>
        </div>

        <div class="form-group">
          <label for="saturacion">Saturación de oxígeno</label>
          <input
            id="saturacion"
            type="number"
            placeholder="Ej. 98"
          />
          <span class="input-hint">%</span>
        </div>

        <div class="form-group">
          <label for="peso">Peso</label>
          <input
            id="peso"
            type="number"
            step="0.1"
            placeholder="Ej. 65.5"
          />
          <span class="input-hint">kg</span>
        </div>

        <div class="form-group">
          <label for="talla">Talla</label>
          <input
            id="talla"
            type="number"
            step="0.01"
            placeholder="Ej. 1.65"
          />
          <span class="input-hint">m</span>
        </div>

      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary">
          Cancelar
        </button>

        <button type="submit" class="btn-primary">
          Registrar signos vitales
        </button>
      </div>

    </form>

  </section>

</div>
