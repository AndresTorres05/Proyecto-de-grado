spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          routes:

            - id: auth-backend
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: messaging-otp
              uri: http://localhost:8082
              predicates:
                - Path=/api/otp/**

            - id: personamayor-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/persona-mayor/acompanantes/**,/api/persona-mayor/organizaciones/**,/api/persona-mayor/emergencia,/api/persona-mayor/*/gustos,/api/persona-mayor/informacion,/api/acompanante/**,/api/organizacion/**,/api/gustos/**
              filters:
                - JwtAuth

            - id: acompanante-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/acompanante/**
              filters:
                - JwtAuth

            - id: organizacion-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/organizacion/**
              filters:
                - JwtAuth

            - id: voluntario-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/voluntario/**
              filters:
                - JwtAuth

            - id: salud-backend
              uri: http://localhost:8084
              predicates:
                - Path=/api/persona-mayor/medicamentos/**
              filters:
                - JwtAuth

            - id: actividad-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/actividades/**
              filters:
                - JwtAuth

server:
  port: 8080

jwt:
  secret: cambia_esto_por_una_clave_larga_y_secreta_1234567890abcdef