# Nombre de la app
spring.application.name=backend

# Conexión a MySQL (XAMPP por defecto: usuario root, sin contraseña)
spring.datasource.url=jdbc:mysql://localhost:3306/proyectogrado_db?useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del backend (por defecto 8080, lo dejamos explícito)
server.port=8080

# Clave secreta para firmar los JWT (temporal, luego la vamos a mover a variable de entorno)
jwt.secret=cambia_esto_por_una_clave_larga_y_secreta_1234567890abcdef
jwt.expiration=86400000