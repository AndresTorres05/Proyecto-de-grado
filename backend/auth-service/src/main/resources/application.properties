# Nombre del servicio y puerto donde lo busca el gateway.
spring.application.name=auth-backend

server.port=8081

# Base de datos PostgreSQL en Supabase, compartida por todos los servicios.
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.lrcpnehwvywypgppxhjr
spring.datasource.password=RedVitaMas+
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate actualiza las tablas al arrancar y muestra en consola el SQL que ejecuta.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Clave y duración del token en milisegundos (86400000 = 24 horas).
# La clave tiene que ser igual a jwt.secret del gateway.
jwt.secret=cambia_esto_por_una_clave_larga_y_secreta_1234567890abcdef
jwt.expiration=86400000

# messaging-service, que verifica los códigos OTP.
messaging.service.url=http://localhost:8082

# Incluye el mensaje de la excepción en las respuestas de error.
server.error.include-message=always

# Pocas conexiones por servicio, porque todos comparten la misma base de datos.
# prepareThreshold=0 porque el pooler de Supabase (puerto 6543) no admite
# sentencias preparadas.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Clave de Hunter para validar correos. Si falta, el servicio no arranca.
hunter.api-key=82fa0ae2842bd288eaa820c27dbf9c8c3c3fc879