spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

          routes:

            - id: auth-backend
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            # Solo el envío es público. /api/otp/verify NO se expone: lo
            # llama auth-backend directo al servicio, y abierto permitiria
            # adivinar codigos de otros celulares sin pasar por el login.
            - id: messaging-otp
              uri: http://localhost:8082
              predicates:
                - Path=/api/otp/send

            # Campanita del panel: SMS enviados al usuario autenticado
            - id: messaging-notificaciones
              uri: http://localhost:8082
              predicates:
                - Path=/api/notificaciones/**
              filters:
                - JwtAuth

            - id: personamayor-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/persona-mayor/acompanantes/**,/api/persona-mayor/organizaciones/**,/api/persona-mayor/emergencia,/api/persona-mayor/*/gustos,/api/persona-mayor/perfil,/api/gustos/**
              filters:
                - JwtAuth

            - id: acompanante-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/acompanante/**
              filters:
                - JwtAuth

            - id: organizacion-personas-mayores-acompanantes
              uri: http://localhost:8085
              predicates:
                - Path=/api/organizacion/personas-mayores/*/acompanantes
              filters:
                - JwtAuth

            # Antes de organizacion-service: /api/organizacion/** la capturaria.
            - id: organizacion-signos-vitales
              uri: http://localhost:8084
              predicates:
                - Path=/api/organizacion/signos-vitales/**
              filters:
                - JwtAuth

            - id: organizacion-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/organizacion/**
              filters:
                - JwtAuth

            - id: voluntario-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/voluntario/**
              filters:
                - JwtAuth

            - id: salud-backend
              uri: http://localhost:8084
              predicates:
                - Path=/api/persona-mayor/medicamentos/**
              filters:
                - JwtAuth

            # Signos vitales de la persona mayor: ver su historial y registrar
            # una medicion propia. No se exponen el PUT/DELETE de este
            # controlador (los registros no se editan ni se borran). OPTIONS
            # es necesario para el preflight de CORS del navegador (si no, no
            # hay ruta y el gateway responde sin cabeceras CORS).
            - id: salud-signos-vitales-persona-mayor
              uri: http://localhost:8084
              predicates:
                - Path=/api/persona-mayor/signos-vitales
                - Method=GET,POST,OPTIONS
              filters:
                - JwtAuth

            - id: actividad-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/actividades/**
              filters:
                - JwtAuth

server:
  port: 8080

jwt:
  secret: cambia_esto_por_una_clave_larga_y_secreta_1234567890abcdef