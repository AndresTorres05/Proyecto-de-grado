# Nombre del servicio y puerto donde lo busca el gateway.
spring.application.name=personamayor-service

server.port=8085

# Base de datos PostgreSQL en Supabase, compartida por todos los servicios.
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.lrcpnehwvywypgppxhjr
spring.datasource.password=RedVitaMas+
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate actualiza las tablas al arrancar y muestra en consola el SQL que ejecuta.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# messaging-service, que envía los avisos de emergencia por SMS.
messaging.service.url=http://localhost:8082


# Pocas conexiones por servicio, porque todos comparten la misma base de datos.
# prepareThreshold=0 porque el pooler de Supabase (puerto 6543) no admite
# sentencias preparadas.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.prepareThreshold=0